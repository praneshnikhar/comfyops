global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Dev: prometheus/grafana run with network_mode: host, so the native
# gateway (venv) and worker are reachable on localhost.
# Prod (k3s): same file mounted in-cluster; replace targets with service DNS.
scrape_configs:
  - job_name: comfyops-gateway
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          component: gateway

  # Worker runs natively on the Mac in prod -> point at its LAN IP, e.g.
  #   - targets: ["192.168.1.x:9100"]
  - job_name: comfyops-worker
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          component: worker