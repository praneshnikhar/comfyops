# S3-compatible object storage (SeaweedFS, Apache-2.0).
# MinIO open-source is archived (Oct 2026), so SeaweedFS replaces it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: comfyops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command: ["server", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-volume.max=10"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9333
              name: master
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
        - name: s3-config
          configMap:
            name: seaweedfs-s3-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
  namespace: comfyops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: comfyops
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "comfyops",
          "credentials": [
            { "accessKey": "comfyops", "secretKey": "comfyops" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: comfyops
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: master
      port: 9333
      targetPort: 9333