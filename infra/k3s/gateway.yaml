# FastAPI gateway. Image is built multi-arch (linux/amd64 for the Asus)
# and pushed to GHCR; see scripts/build-images.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: comfyops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/praneshnikhar/comfyops-gateway:latest
          ports:
            - containerPort: 8000
          env:
            - name: COMFYOPS_RABBITMQ_URL
              value: amqp://guest:guest@rabbitmq:5672/
            - name: COMFYOPS_RABBITMQ_MGMT_URL
              value: http://guest:guest@rabbitmq:15672/
            - name: COMFYOPS_MINIO_ENDPOINT
              value: seaweedfs:9000
            - name: COMFYOPS_REDIS_URL
              value: redis://valkey:6379/0
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: comfyops
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 31000
  type: NodePort