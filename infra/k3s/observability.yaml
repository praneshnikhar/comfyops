# Prometheus (M2/M3 observability) — scrapes gateway, worker (Mac LAN IP),
# and pushgateway. HostNetwork so it can reach the Mac worker's LAN IP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: comfyops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      hostNetwork: true
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=15d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: comfyops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: comfyops-gateway
        static_configs:
          - targets: ["127.0.0.1:31000"]
            labels: { component: gateway }
      # Mac worker: replace 192.168.1.x with the Mac's LAN IP.
      - job_name: comfyops-worker
        static_configs:
          - targets: ["192.168.1.50:9100"]
            labels: { component: worker }
      - job_name: pushgateway
        honor_labels: true
        static_configs:
          - targets: ["127.0.0.1:9091"]
            labels: { component: gate }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: comfyops
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: comfyops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pushgateway
  template:
    metadata:
      labels:
        app: pushgateway
    spec:
      hostNetwork: true
      containers:
        - name: pushgateway
          image: prom/pushgateway:latest
          ports:
            - containerPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: comfyops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      hostNetwork: true
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: comfyops
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: comfyops
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: Prometheus
        type: prometheus
        access: proxy
        url: http://127.0.0.1:30090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: comfyops
        orgId: 1
        folder: ComfyOps
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
